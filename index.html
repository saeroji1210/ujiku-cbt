      <h1>UjiKu CBT · Ujian Berbasis Komputer untuk Sekolah</h1>
      <p>UjiKu CBT adalah aplikasi ujian berbasis komputer (Computer Based Test) untuk sekolah, madrasah, bimbel, dan kampus. Siswa menekan Selesai, nilai langsung keluar otomatis.</p>
      <h2>Fitur Unggulan UjiKu CBT</h2>
      <ul>
        <li><strong>Impor Soal dari Word:</strong> Guru dapat mengunggah naskah soal langsung dari dokumen Microsoft Word tanpa input manual satu per satu.</li>
        <li><strong>Nilai Keluar Otomatis:</strong> Skor ujian langsung dihitung secara instan begitu siswa menekan tombol Selesai.</li>
        <li><strong>Analisis Butir Soal:</strong> Dilengkapi laporan analisis butir soal otomatis untuk mengevaluasi tingkat kesulitan ujian.</li>
        <li><strong>Bisa Berjalan Tanpa Internet:</strong> Mendukung pelaksanaan ujian secara lokal maupun online dengan ringan dan stabil.</li>
      </ul>
      <p><em>Catatan: Aktifkan JavaScript pada browser Anda untuk memakai UjiKu CBT.</em></p>
    </main>
